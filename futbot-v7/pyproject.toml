[project]
name = "test-robot"
version = "0.1.0"
requires-python = ">=3.11,<3.15"

dependencies = [
    "opencv-python>=4.13.0.92,<5",
    "numpy>=2,<3",
    "pyserial>=3.5",
    "smbus2>=0.4",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.24.4,<2",
]
model-tools = [
    "onnxruntime>=1.24.4,<2",
    "ultralytics>=8.4.53,<9",
]
rpi = [
    "ncnn",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
