# ============================================================
# FutbotMX — dnsmasq-ap.conf
# DHCP exclusivo en wlan0 (no toca eth0 ni systemd-resolved)
# ============================================================

interface=wlan0
bind-interfaces               # Solo escucha en wlan0 — evita conflicto con puerto 53

# ── DHCP pool ─────────────────────────────────────────────────
dhcp-range=192.168.10.10,192.168.10.50,255.255.255.0,24h

# ── Gateway y DNS para los clientes ───────────────────────────
dhcp-option=3,192.168.10.1   # Gateway = robot1
dhcp-option=6,8.8.8.8        # DNS = Google (red aislada, referencial)

# ── IP fija para robot2 por nombre de host ────────────────────
dhcp-host=robot2,192.168.10.12

# ── Log de asignaciones (útil para debug) ─────────────────────
log-dhcp